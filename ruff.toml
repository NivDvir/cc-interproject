target-version = "py39"
line-length = 110

[lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM", "RET", "PIE", "TRY", "BLE", "C901", "T20", "ERA"]

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
"src/cc_interproject/cli.py" = ["T20"]
"src/cc_interproject/wizard/terminal.py" = ["T20"]
"src/cc_interproject/hooks/*.py" = ["T20"]
"tools/*.py" = ["T20"]
"fixtures/claude_fake/claude" = ["T20"]

[format]
quote-style = "double"

exclude = ["dist/"]
