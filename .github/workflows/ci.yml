name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Report Python version
        run: python -c "import sys; print(sys.version)"

      - name: Put fake claude on PATH
        shell: bash
        run: echo "$PWD/fixtures/claude_fake" >> "$GITHUB_PATH"

      - name: Install dev tools
        run: python -m pip install ruff pytest

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: python -m pytest -q

      - name: Bundle check
        run: python tools/bundle.py --check

      - name: Dry-run install smoke test
        shell: bash
        env:
          KIT_SKIP_AUTH: "1"
        run: |
          FOREST="$(mktemp -d)/forest"
          cp -R fixtures/forest "$FOREST"
          printf 'all\n' | python dist/install.py --dry-run --no-browser \
            --root "$FOREST" --modules laws | tee out.txt
          grep -q "Dry run: nothing written." out.txt

      - name: Upload bundled installer
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: install.py
          path: dist/install.py
